services:
  - type: web
    name: apk-permission-patcher
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1 --worker-class sync
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JAVA_HOME
        value: /opt/render/project/src/tools/jdk21
      - key: PATH
        value: /opt/render/project/src/tools/jdk21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    autoDeploy: true
